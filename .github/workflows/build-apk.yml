name: Build OBpartner APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键打包 / Supports manual one-click trigger

permissions:
  contents: write

jobs:
  build:
    name: Compile and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk OBpartner.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBpartner-debug
          path: OBpartner.apk
          retention-days: 14

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "OBpartner 最新构建 (Latest Build)"
          body: "🎉 OBpartner 最新编译的 APK 安装包已生成，点击下方 Assets 中的 OBpartner.apk 即可直接高速下载。"
          files: OBpartner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
